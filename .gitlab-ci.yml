stages:
  - test
  - deploy

# ============================
# 1. SECURITY & QUALITY CHECKS 
# ============================

# Include GitLab's native templates to automatically scan for 
# hardcoded secrets and known vulnerabilities (SAST).
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml


# ====================
# 2. VERCEL DEPLOYMENT 
# ====================

# Creates a Preview Deployment for any branch EXCEPT master
deploy_preview:
  stage: deploy
  image: node:22
  except:
    - master
  script:
    - npm install --global vercel pnpm
    - export VERCEL_ORG_ID=$VERCEL_ORG_ID
    - export VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN -m gitlabDeployment="1" -m gitlabCommitRef="$CI_COMMIT_REF_NAME"

# Creates a Production Deployment when merging into master
deploy_production:
  stage: deploy
  image: node:22
  only:
    - master
  script:
    - npm install --global vercel pnpm
    - export VERCEL_ORG_ID=$VERCEL_ORG_ID
    - export VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN -m gitlabDeployment="1" -m gitlabCommitRef="master"